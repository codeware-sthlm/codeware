name: Fly Deployment

# This workflow is triggered by a pull request or push to the main branch.
# Renovate and Nx migrations are ignored.
# Deployments run when the preview label is present (auto-added on PR open) or when closing PRs for cleanup.
# Can also be triggered manually for re-deployments.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (leave empty for all affected apps)"
        required: false
        type: choice
        options:
          - ""
          - cms
          - web
      tenant:
        description: "Tenant ID (leave empty for all tenants, only applies to
          multi-tenant apps)"
        required: false
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - preview
          - production
        default: production
      pr-number:
        description: "PR number to deploy (required for preview, ignored for
          production)"
        required: false
        type: string
      console-logs:
        description: "Show native logs from e.g. Fly and Docker"
        required: false
        type: boolean
        default: false
  # Primary trigger once this workflow is on the default branch:
  # deployment only starts after CI checks pass.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NX_NO_CLOUD: true
  # Label used to indicate that a preview deployment is enabled for the PR
  FLY_PREVIEW_LABEL: preview-deploy

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Normalize the branch name across all trigger types so push and workflow_run
  # on the same branch share one concurrency slot and cannot run simultaneously.
  # github.ref is refs/heads/main for push; workflow_run gives head_branch=main.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  analyze-conditions:
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.conditions.outputs.skip }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build conditions action
        run: pnpm nx build fly-conditions-action

      - name: Analyze deployment conditions
        id: conditions
        uses: ./packages/fly-conditions-action
        with:
          preview-label: ${{ env.FLY_PREVIEW_LABEL }}
          token: ${{ secrets.GITHUB_TOKEN }}

  pre-deploy:
    needs: analyze-conditions
    if: ${{ needs.analyze-conditions.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.pre-deploy.outputs.apps }}
      environment: ${{ steps.pre-deploy.outputs.environment }}
      app-tenants: ${{ steps.pre-deploy.outputs.app-tenants }}
      pr-number: ${{ steps.resolve-pr.outputs.number }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pre-deploy action
        run: pnpm nx build nx-pre-deploy-action

      - name: Set SHAs for affected calculations
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main
          set-environment-variables-for-job: true

      # workflow_run payload, then pull_request event, then manual dispatch input
      - name: Resolve PR number
        id: resolve-pr
        env:
          WR_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          DIRECT_PR: ${{ github.event.number }}
          MANUAL_PR: ${{ github.event.inputs.pr-number }}
        run: |
          PR=$(echo "$WR_PRS" | jq -r 'first | .number // empty')
          PR="${PR:-${DIRECT_PR:-$MANUAL_PR}}"
          # Drop non-numeric input before it can reach tagging
          [[ "$PR" =~ ^[0-9]+$ ]] || PR=""
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # App name, database and tags are all keyed on the PR number
      - name: Require PR number for manual preview
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'preview' &&
          steps.resolve-pr.outputs.number == '' }}
        run: |
          echo "::error::A PR number is required to deploy to preview. Re-run this workflow with the 'pr-number' input set."
          exit 1

      - name: Run pre-deploy
        id: pre-deploy
        uses: ./packages/nx-pre-deploy-action
        with:
          infisical-client-id: ${{ secrets.INFISICAL_READ_CLIENT_ID }}
          infisical-client-secret: ${{ secrets.INFISICAL_READ_CLIENT_SECRET }}
          infisical-project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          manual-app: ${{ github.event.inputs.app }}
          manual-tenant: ${{ github.event.inputs.tenant }}
          manual-environment: ${{ github.event.inputs.environment }}
        env:
          # Must be defined since `github.json` is validated and cms app uses env
          POSTGRES_PREVIEW: ${{ vars.FLY_POSTGRES_PREVIEW }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.number }}

  build:
    needs: pre-deploy
    if: >-
      ${{ needs.pre-deploy.outputs.environment != '' &&
      needs.pre-deploy.outputs.apps != '[]' && github.event.action != 'closed'
      }}
    runs-on: ubuntu-latest
    env:
      SENTRY_ORG: ${{ secrets.INF_SENTRY_ORG }}
    outputs:
      images: ${{ steps.build.outputs.images }}
      # Apps from pre-deploy, enriched with the resolved Sentry release names
      apps: ${{ steps.sentry-apps.outputs.apps }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.CDWR_ACTIONS_BOT_ID }}
          private-key: ${{ secrets.CDWR_ACTIONS_BOT_PRIVATE_KEY }}

      # Privileged job (secrets + write token) — keep the default ref, never
      # check out `pull_request.head.sha`
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Push tags as the app, the ruleset's bypass actor
          token: ${{ steps.generate-token.outputs.token }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build build action
        run: pnpm nx build fly-build-action

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ vars.FLY_CLI_VERSION }}

      - name: Resolve flags
        id: flags
        run: |
          echo "console-logs=${{ github.event.inputs.console-logs == 'true' && 'true' || vars.FLY_CONSOLE_LOGS }}" >> "$GITHUB_OUTPUT"

      # Build metadata surfaced by each app's About UI
      - name: Resolve build metadata
        id: meta
        env:
          # PR head rather than the merge ref, so the sha is findable
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "short-sha=$(echo "$BUILD_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "build-time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Bump each affected app's manifest and tag it. `git-commit false` keeps the
      # branch untouched — only tags are pushed.
      - name: Version apps
        env:
          ENVIRONMENT: ${{ needs.pre-deploy.outputs.environment }}
          # PR numbers start at 1, so 0 is a safe lane for manual dispatches
          PR_NUMBER: ${{ needs.pre-deploy.outputs.pr-number || 0 }}
          # Empty outside pull_request, where HEAD is already a real commit
          TAG_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          committer='${{ vars.CDWR_COMMITTER }}'
          email="${committer##*<}"
          git config user.name "${committer%% <*}"
          git config user.email "${email%>}"
          args=(--group apps --git-commit false --git-tag)
          if [ "$ENVIRONMENT" != "production" ]; then
            # Per-PR lane so concurrent PRs don't race for the same counter
            args+=(--preid "preview.${PR_NUMBER}")
          fi

          before="$(git tag --list | sort)"
          pnpm nx release version "${args[@]}"
          after="$(git tag --list | sort)"

          # Push only the new tags. `--git-push` would push the current branch,
          # which fails on the detached HEAD left by checkout.
          new_tags="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after"))"
          if [ -z "$new_tags" ]; then
            echo "No new tags to push"
          else
            # Nx tags HEAD, which is the ephemeral merge ref on pull_request
            if [ -n "$TAG_SHA" ]; then
              for t in $new_tags; do git tag -f -a "$t" -m "$t" "$TAG_SHA"; done
            fi
            echo "Pushing tags: $(echo $new_tags)"
            # shellcheck disable=SC2086
            git push --no-verify --atomic origin $new_tags
          fi

      # `nx release version` only writes a manifest when conventional commits
      # produce a bump for that project, but `nx affected` deploys an app
      # whenever anything it depends on changed. An app can therefore be rebuilt
      # without being bumped, and since bumps are never committed (only tagged),
      # its manifest still holds the placeholder version that lives in git.
      #
      # The tags are the real source of truth, so backfill whatever nx left
      # alone. The image inlines this value for the About UI and /api/version,
      # and the Sentry release name is derived from it — all three agree.
      - name: Backfill unbumped app versions
        env:
          APPS: ${{ needs.pre-deploy.outputs.apps }}
          ENVIRONMENT: ${{ needs.pre-deploy.outputs.environment }}
          PR_NUMBER: ${{ needs.pre-deploy.outputs.pr-number || 0 }}
        run: |
          set -euo pipefail

          # `versionsort.suffix` makes git rank `-preview.N` below its own
          # release; a plain `-v:refname` sort gets that backwards
          latest_tag() {
            git -c versionsort.suffix=-preview tag --list "$1" --sort=-v:refname \
              | { [ "${2:-}" = release-only ] && grep -v -- '-preview\.' || cat; } \
              | head -1
          }

          for name in $(jq -r '.[].name' <<< "$APPS"); do
            config="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .flyConfigFile' <<< "$APPS")"
            manifest="$(dirname "$config")/package.json"

            # nx stages what it writes, so compare against HEAD rather than the
            # working tree
            if ! git diff HEAD --quiet -- "$manifest"; then
              echo "$name: bumped to $(jq -r .version "$manifest")"
              continue
            fi

            tag=''
            if [ "$ENVIRONMENT" != production ]; then
              # Stay in this PR's lane — another PR's preview tag is not our version
              tag="$(latest_tag "${name}-[0-9]*-preview.${PR_NUMBER}.*")"
            fi
            # Otherwise the newest real release the app was last cut at
            [ -n "$tag" ] || tag="$(latest_tag "${name}-[0-9]*" release-only)"

            version="${tag#"${name}-"}"
            if [ -z "$version" ]; then
              echo "$name: no release tag, keeping $(jq -r .version "$manifest")"
              continue
            fi

            tmp="$(mktemp)"
            jq --arg v "$version" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
            echo "$name: not bumped, backfilled to $version"
          done

      # One release per build per app, `name@version+sha`, using the version
      # resolved above. All tenants of an app share it — tenants are told
      # apart by a runtime tag, never by a separate release.
      - name: Resolve Sentry releases
        id: sentry-apps
        env:
          APPS: ${{ needs.pre-deploy.outputs.apps }}
          SHORT_SHA: ${{ steps.meta.outputs.short-sha }}
        run: |
          set -euo pipefail
          apps="$APPS"
          for name in $(jq -r '.[] | select(.sentry) | .name' <<< "$APPS"); do
            config="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .flyConfigFile' <<< "$APPS")"
            version="$(jq -r .version "$(dirname "$config")/package.json")"
            release="${name}@${version}+${SHORT_SHA}"
            echo "$name -> $release"
            apps="$(jq -c --arg n "$name" --arg r "$release" \
              'map(if .name == $n then .sentry.release = $r else . end)' <<< "$apps")"
          done
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      # The Sentry bundler plugins upload source maps during the Docker build and
      # expect the release to already exist (cms next.config.mjs: create: false).
      # So releases are created here, before the build, and deleted below if
      # anything afterwards fails.
      - name: Create Sentry releases
        id: sentry-release
        if: env.SENTRY_ORG != ''
        env:
          APPS: ${{ steps.sentry-apps.outputs.apps }}
          SENTRY_AUTH_TOKEN: ${{ secrets.INF_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.INF_SENTRY_ORG }}
        run: |
          set -euo pipefail
          jq -r '.[] | select(.sentry.release) | "\(.sentry.project) \(.sentry.release)"' <<< "$APPS" |
            while read -r project release; do
              echo "Creating '$release' in project '$project'"
              SENTRY_PROJECT="$project" pnpm sentry-cli releases new "$release"
              # Commit association is best-effort; a shallow or unmatched history
              # must not fail the build
              SENTRY_PROJECT="$project" pnpm sentry-cli releases set-commits --auto "$release" \
                || echo "::warning::Could not associate commits with '$release'"
            done

      - name: Build Docker images
        id: build
        uses: ./packages/fly-build-action
        with:
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          fly-org: ${{ vars.FLY_ORG }}
          fly-trace-cli: ${{ vars.FLY_TRACE_CLI }}
          fly-console-logs: ${{ steps.flags.outputs.console-logs }}
          token: ${{ steps.generate-token.outputs.token }}
          apps: ${{ steps.sentry-apps.outputs.apps }}
          environment: ${{ needs.pre-deploy.outputs.environment }}
          app-details: ${{ needs.pre-deploy.outputs.app-tenants }}
          pr-number: ${{ needs.pre-deploy.outputs.pr-number }}
          # Shared build arguments. The per-app SENTRY_DSN, SENTRY_PROJECT and
          # SENTRY_RELEASE are added by the action from each app's `sentry` details.
          build-args: |
            APP_SHA=${{ steps.meta.outputs.short-sha }}
            APP_BUILD_TIME=${{ steps.meta.outputs.build-time }}
            DEPLOY_ENV=${{ needs.pre-deploy.outputs.environment }}
            NEXT_PUBLIC_DEPLOY_ENV=${{ needs.pre-deploy.outputs.environment }}
            SENTRY_ORG=${{ secrets.INF_SENTRY_ORG }}
            SENTRY_AUTH_TOKEN=${{ secrets.INF_SENTRY_AUTH_TOKEN }}
          opt-out-depot-builder: ${{ vars.FLY_OPT_OUT_DEPOT }}

      # Upload images map as artifact — job outputs are suppressed by GitHub
      # when they match registered secret patterns (Fly registry URLs can trigger this).
      # Artifact files bypass secret scanning and are read by the action's Node process.
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: fly-built-images-${{ github.run_id }}
          path: ${{ steps.build.outputs.images-path }}
          retention-days: 1
          if-no-files-found: error

      # Clean up the Sentry releases if the build failed.
      - name: Delete Sentry releases on build failure
        if: >-
          always() && env.SENTRY_ORG != '' && steps.sentry-release.outcome == 'success' &&
          steps.build.outcome != 'success'
        env:
          APPS: ${{ steps.sentry-apps.outputs.apps }}
          SENTRY_AUTH_TOKEN: ${{ secrets.INF_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.INF_SENTRY_ORG }}
        run: |
          jq -r '.[] | select(.sentry.release) | "\(.sentry.project) \(.sentry.release)"' <<< "$APPS" |
            while read -r project release; do
              SENTRY_PROJECT="$project" pnpm sentry-cli releases delete "$release" || true
            done

  deploy:
    needs: [pre-deploy, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    # Not possible to provide url since we might have multiple deployments
    environment: ${{ needs.pre-deploy.outputs.environment }}

    outputs:
      environment: ${{ steps.deployment.outputs.environment }}
      deployed: ${{ steps.deployment.outputs.deployed }}
      failed: ${{ steps.deployment.outputs.failed }}
      projects: ${{ steps.deployment.outputs.projects }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.CDWR_ACTIONS_BOT_ID }}
          private-key: ${{ secrets.CDWR_ACTIONS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployment action
        run: pnpm nx build fly-deployment-action

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ vars.FLY_CLI_VERSION }}

      - name: Resolve flags
        id: flags
        run: |
          echo "console-logs=${{ github.event.inputs.console-logs == 'true' && 'true' || vars.FLY_CONSOLE_LOGS }}" >> "$GITHUB_OUTPUT"

      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: fly-built-images-${{ github.run_id }}
          path: ${{ runner.temp }}/fly-images

      - name: Deploy to Fly
        id: deployment
        uses: ./packages/fly-deployment-action
        with:
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          fly-org: ${{ vars.FLY_ORG }}
          fly-region: ${{ vars.FLY_REGION }}
          fly-trace-cli: ${{ vars.FLY_TRACE_CLI }}
          fly-console-logs: ${{ steps.flags.outputs.console-logs }}
          token: ${{ steps.generate-token.outputs.token }}
          apps: ${{ needs.build.outputs.apps }}
          environment: ${{ needs.pre-deploy.outputs.environment }}
          app-details: ${{ needs.pre-deploy.outputs.app-tenants }}
          pr-number: ${{ needs.pre-deploy.outputs.pr-number }}
          images-path: ${{ runner.temp }}/fly-images/fly-built-images.json
          # Shared runtime environment variables. The per-app SENTRY_DSN,
          # SENTRY_PROJECT and SENTRY_RELEASE are added by the action from each
          # app's `sentry` details.
          env: |
            INFISICAL_SITE=${{ vars.INFISICAL_SITE }}
            SENTRY_ORG=${{ secrets.INF_SENTRY_ORG }}
          # Sensitive secrets are also passed to app env on deployment
          secrets: |
            INFISICAL_CLIENT_ID=${{ secrets.INFISICAL_READ_CLIENT_ID }}
            INFISICAL_CLIENT_SECRET=${{ secrets.INFISICAL_READ_CLIENT_SECRET }}
            INFISICAL_PROJECT_ID=${{ secrets.INFISICAL_PROJECT_ID }}
            SENTRY_AUTH_TOKEN=${{ secrets.INF_SENTRY_AUTH_TOKEN }}
          opt-out-depot-builder: ${{ vars.FLY_OPT_OUT_DEPOT }}

      - name: Finalize Sentry releases
        if: steps.deployment.outcome == 'success'
        env:
          APPS: ${{ needs.build.outputs.apps }}
          ENVIRONMENT: ${{ needs.pre-deploy.outputs.environment }}
          SENTRY_AUTH_TOKEN: ${{ secrets.INF_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.INF_SENTRY_ORG }}
        run: |
          set -euo pipefail
          jq -r '.[] | select(.sentry.release) | "\(.sentry.project) \(.sentry.release)"' <<< "$APPS" |
            while read -r project release; do
              SENTRY_PROJECT="$project" pnpm sentry-cli releases finalize "$release"
              # Record where it landed, now that the deployment has succeeded
              SENTRY_PROJECT="$project" pnpm sentry-cli deploys new \
                --release "$release" --env "$ENVIRONMENT"
            done

      # Clean up the Sentry releases if deployment failed.
      - name: Delete Sentry releases on deployment failure
        if: always() && steps.deployment.outcome != 'success'
        env:
          APPS: ${{ needs.build.outputs.apps }}
          SENTRY_AUTH_TOKEN: ${{ secrets.INF_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.INF_SENTRY_ORG }}
        run: |
          jq -r '.[] | select(.sentry.release) | "\(.sentry.project) \(.sentry.release)"' <<< "$APPS" |
            while read -r project release; do
              SENTRY_PROJECT="$project" pnpm sentry-cli releases delete "$release" || true
            done

      # Upload projects as artifact — job outputs containing Fly.io URLs can be suppressed
      # by GitHub Actions secret scanning. Artifact files bypass secret scanning.
      - name: Upload projects artifact
        if: always() && steps.deployment.outputs.projects-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: fly-deployed-projects-${{ github.run_id }}
          path: ${{ steps.deployment.outputs.projects-path }}
          retention-days: 1
          if-no-files-found: warn

  pr-comment:
    needs: [pre-deploy, deploy]
    if: >-
      always() &&
      (github.event_name == 'pull_request' && github.event.action != 'closed' ||
       github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.CDWR_ACTIONS_BOT_ID }}
          private-key: ${{ secrets.CDWR_ACTIONS_BOT_PRIVATE_KEY }}

      # workflow_run payload, then pull_request event, then manual dispatch input
      - name: Resolve PR number
        id: resolve-pr
        env:
          WR_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          DIRECT_PR: ${{ github.event.number }}
          MANUAL_PR: ${{ github.event.inputs.pr-number }}
        run: |
          PR=$(echo "$WR_PRS" | jq -r 'first | .number // empty')
          PR="${PR:-${DIRECT_PR:-$MANUAL_PR}}"
          # Drop non-numeric input before it can reach tagging
          [[ "$PR" =~ ^[0-9]+$ ]] || PR=""
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PR comment action
        run: pnpm nx build pr-comment-action

      - name: Download projects artifact
        uses: actions/download-artifact@v4
        with:
          name: fly-deployed-projects-${{ github.run_id }}
          path: ${{ runner.temp }}/fly-projects
        continue-on-error: true

      - name: Post PR comment
        uses: ./packages/pr-comment-action
        with:
          pull-request: ${{ steps.resolve-pr.outputs.number }}
          environment: ${{ needs.deploy.outputs.environment }}
          deployed: ${{ needs.deploy.outputs.deployed }}
          failed: ${{ needs.deploy.outputs.failed }}
          projects-path: ${{ runner.temp }}/fly-projects/fly-projects.json
          token: ${{ steps.generate-token.outputs.token }}

  notify:
    needs: [pre-deploy, build, deploy]
    if: >-
      always() &&
      needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      # workflow_run payload, then pull_request event, then manual dispatch input
      - name: Resolve PR number
        id: resolve-pr
        env:
          WR_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          DIRECT_PR: ${{ github.event.number }}
          MANUAL_PR: ${{ github.event.inputs.pr-number }}
        run: |
          PR=$(echo "$WR_PRS" | jq -r 'first | .number // empty')
          PR="${PR:-${DIRECT_PR:-$MANUAL_PR}}"
          # Drop non-numeric input before it can reach tagging
          [[ "$PR" =~ ^[0-9]+$ ]] || PR=""
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Download projects artifact
        uses: actions/download-artifact@v4
        with:
          name: fly-deployed-projects-${{ github.run_id }}
          path: ${{ runner.temp }}/fly-projects
        continue-on-error: true

      - name: Build Slack payload
        id: build-payload
        env:
          ENVIRONMENT: ${{ needs.pre-deploy.outputs.environment }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECTS_FILE: ${{ runner.temp }}/fly-projects/fly-projects.json
        run: |
          ENV_LABEL=$([ "$ENVIRONMENT" = "production" ] && echo "Production" || echo "Preview")
          PR_SUFFIX=$([ -n "$PR_NUMBER" ] && echo " · PR #${PR_NUMBER}" || echo "")
          if [ "$DEPLOY_RESULT" = "success" ]; then
            HEADER="✅ ${ENV_LABEL} Deployment${PR_SUFFIX}"
          elif [ "$BUILD_RESULT" != "success" ]; then
            HEADER="❌ ${ENV_LABEL} Build${PR_SUFFIX}"
          else
            HEADER="❌ ${ENV_LABEL} Deployment${PR_SUFFIX}"
          fi

          APPS_TEXT=""
          if [ -f "$PROJECTS_FILE" ]; then
            APPS_TEXT=$(jq -r '
              .[] |
              if .action == "deploy" then "✅ *" + .name + "* — <" + .url + "|" + .url + ">"
              elif .action == "failed" then "❌ *" + .appOrProject + "* — " + .error
              else empty
              end
            ' "$PROJECTS_FILE")
          fi

          PAYLOAD=$(jq -nc \
            --arg header "$HEADER" \
            --arg apps "$APPS_TEXT" \
            --arg run_url "$RUN_URL" \
            '{
              "blocks": (
                [{"type":"header","text":{"type":"plain_text","text":$header,"emoji":true}}]
                + (if ($apps | length) > 0 then [{"type":"section","text":{"type":"mrkdwn","text":$apps}}] else [] end)
                + [{"type":"context","elements":[{"type":"mrkdwn","text":("<" + $run_url + "|View workflow run>")}]}]
              )
            }')

          echo "payload<<PAYLOAD_EOF" >> "$GITHUB_OUTPUT"
          echo "$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "PAYLOAD_EOF" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          errors: true
          payload: ${{ steps.build-payload.outputs.payload }}

  destroy:
    needs: pre-deploy
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.CDWR_ACTIONS_BOT_ID }}
          private-key: ${{ secrets.CDWR_ACTIONS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build destroy action
        run: pnpm nx build fly-destroy-action

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: ${{ vars.FLY_CLI_VERSION }}

      - name: Resolve flags
        id: flags
        run: |
          echo "console-logs=${{ github.event.inputs.console-logs == 'true' && 'true' || vars.FLY_CONSOLE_LOGS }}" >> "$GITHUB_OUTPUT"

      - name: Destroy preview apps
        id: destroy
        uses: ./packages/fly-destroy-action
        with:
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          fly-trace-cli: ${{ vars.FLY_TRACE_CLI }}
          fly-console-logs: ${{ steps.flags.outputs.console-logs }}
          token: ${{ steps.generate-token.outputs.token }}

  summary:
    needs:
      [
        analyze-conditions,
        pre-deploy,
        build,
        deploy,
        destroy,
        pr-comment,
        notify
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        env:
          SKIPPED: ${{ needs.analyze-conditions.outputs.skip }}
          ENVIRONMENT: ${{ needs.pre-deploy.outputs.environment }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DESTROY_RESULT: ${{ needs.destroy.result }}
          IS_CLOSED_PR:
            ${{ github.event_name == 'pull_request' && github.event.action ==
            'closed' }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          MANUAL_APP: ${{ github.event.inputs.app }}
          MANUAL_TENANT: ${{ github.event.inputs.tenant }}
          CONSOLE_LOGS: ${{ github.event.inputs.console-logs }}
        run: |
          if [ "$IS_MANUAL" = "true" ]; then
            echo "🔧 Manual deployment triggered" >> $GITHUB_STEP_SUMMARY
            [ -n "$MANUAL_APP" ] && echo "  - App: $MANUAL_APP" >> $GITHUB_STEP_SUMMARY
            [ -n "$MANUAL_TENANT" ] && echo "  - Tenant: $MANUAL_TENANT" >> $GITHUB_STEP_SUMMARY
            echo "  - Environment: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
            [ "$CONSOLE_LOGS" = "true" ] && echo "  - Console logs: enabled" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$IS_CLOSED_PR" = "true" ]; then
            echo "🚪 PR closed - running cleanup" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$DESTROY_RESULT" = "success" ]; then
              echo "✅ Preview apps destroyed successfully" >> $GITHUB_STEP_SUMMARY
            elif [ "$DESTROY_RESULT" = "skipped" ]; then
              echo "⏭️ No preview apps to destroy" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Preview app cleanup failed or was cancelled" >> $GITHUB_STEP_SUMMARY
            fi
            exit 0
          fi

          if [ "$SKIPPED" = "true" ]; then
            echo "⏭️ Deployment skipped - conditions not met" >> $GITHUB_STEP_SUMMARY
          elif [ "$ENVIRONMENT" = "" ]; then
            echo "⏭️ No affected apps" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEPLOY_RESULT" = "success" ]; then
            echo "✅ Build and deployment completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEPLOY_RESULT" = "skipped" ] && [ "$BUILD_RESULT" = "skipped" ]; then
            echo "⏭️ No apps to deploy" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build or deployment failed or was cancelled" >> $GITHUB_STEP_SUMMARY
          fi
