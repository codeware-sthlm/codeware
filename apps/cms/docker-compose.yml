# Only for Development.
# Should be started from workspace root.

# Hard coded environment variables is a valid workaround for using database images locally.
# Should match what we get from `process.env.DATABASE_URL`.

services:
  postgres:
    container_name: postgres
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cms
    networks:
      - local
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches every mail the app sends in development. No account, nothing to
  # expire — read it at http://localhost:8025
  mailpit:
    container_name: mailpit
    image: axllent/mailpit
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - local
    volumes:
      - mailpitdata:/data
    environment:
      - MP_DATA_FILE=/data/mailpit.db

  cms:
    container_name: cms
    image: cms
    build:
      context: ../../
      dockerfile: apps/cms/Dockerfile
    ports:
      - 3000:3000
    env_file:
      - .env.docker
    networks:
      - local
    depends_on:
      - postgres

networks:
  local:
    name: payload-local
    driver: bridge

volumes:
  pgdata:
    name: cms_pgdata
  mailpitdata:
    name: cms_mailpitdata
